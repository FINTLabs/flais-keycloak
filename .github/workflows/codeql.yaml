name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "20 3 * * 0,3,5"

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
      js_ts: ${{ steps.filter.outputs.js_ts }}
      java_kotlin: ${{ steps.filter.outputs.java_kotlin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            actions:
              - ".github/workflows/**"
              - ".github/actions/**"
            java_kotlin:
              - "keycloak/src/**"
              - "keycloak/buildSrc/**"
              - "keycloak/gradle/**"
              - "keycloak/build.gradle.kts"
              - "keycloak/settings.gradle.kts"
              - "keycloak/gradle.properties"
              - "keycloak/libs/flais-scim-server/**"
              - "keycloak/libs/flais-provider/**"
            js_ts:
              - "keycloak/libs/flais-theme/**"
              - "apps/**"

  analyze-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      run_analysis: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.actions == 'true' }}
    steps:
      - if: env.run_analysis == 'true'
        uses: actions/checkout@v7

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: actions

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

  analyze-js-ts:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      run_analysis: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.js_ts == 'true' }}
    steps:
      - if: env.run_analysis == 'true'
        uses: actions/checkout@v7

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  analyze-java-kotlin:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      run_analysis: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.java_kotlin == 'true' }}
    steps:
      - if: env.run_analysis == 'true'
        uses: actions/checkout@v7

      - if: env.run_analysis == 'true'
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild

      - if: env.run_analysis == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
