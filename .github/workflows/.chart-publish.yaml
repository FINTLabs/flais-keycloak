name: Publish Chart

on:
  workflow_call:
    inputs:
      image_tags:
        description: "The image tag of the application"
        type: string
        required: true
      image_digest:
        description: "Published application image digest"
        type: string
        required: true
      chart_name:
        description: "The name of the chart"
        type: string
        required: true

jobs:
  chart-meta:
    name: Apply Chart Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - id: commit-hash
        uses: prompt/actions-commit-hash@9e673021a12f5b5506d4da77ffbb8446e8a37b4a

      - id: versions
        run: |
          echo "chart_version=$(date +'%Y%m%d')-${{ steps.commit-hash.outputs.short }}" >> ${GITHUB_OUTPUT}

          full_tag="${{ inputs.image_tags }}"
          version="${full_tag##*:}"
          echo "Extracted version: $version"
          echo "app_version=$version" >> $GITHUB_OUTPUT

      - name: Update chart metadata and image digest
        uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e
        with:
          cmd: |
            yq e -i '.version = "${{ steps.versions.outputs.chart_version }}"' ./charts/${{ inputs.chart_name }}/Chart.yaml
            yq e -i '.image.digest = "${{ inputs.image_digest }}"' ./charts/${{ inputs.chart_name }}/values.yaml
            yq e -i '.appVersion = "${{ steps.versions.outputs.app_version }}"' ./charts/${{ inputs.chart_name }}/Chart.yaml

      - name: Save Chart Meta
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.chart_name }}-chart-metadata
          path: |
            ./charts/${{ inputs.chart_name }}/Chart.yaml
            ./charts/${{ inputs.chart_name }}/values.yaml

  publish-chart:
    name: Publish Helm Chart
    needs: chart-meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore Chart Metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.chart_name }}-chart-metadata
          path: ./charts/${{ inputs.chart_name }}

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e
        name: Setup Helm

      - name: Login to Flais Helm Repository
        run: echo "${{ secrets.FLAIS_HELM_PASSWORD }}" | helm registry login ${{ vars.FLAIS_HELM_ENDPOINT }} --username ${{ vars.FLAIS_HELM_USERNAME }} --password-stdin

      - name: Build Charts
        run: |
          helm package ./charts/${{ inputs.chart_name }} -d ./charts/${{ inputs.chart_name }}

      - name: Push Charts
        run: |
          helm push ./charts/${{ inputs.chart_name }}/*.tgz oci://${{ vars.FLAIS_HELM_ENDPOINT }}/helm
