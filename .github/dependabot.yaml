version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/keycloak/libs/flais-theme/"
      - "/keycloak/tools/flais-scim-auth/"
      - "/apps/flais-keycloak-demo/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/keycloak/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 15
    groups:
      keycloak-major:
        patterns:
          - "org.keycloak:*"
          - "org.keycloak.bom:*"
        update-types:
          - "major"
      keycloak:
        patterns:
          - "org.keycloak:*"
          - "org.keycloak.bom:*"
        update-types:
          - "minor"
          - "patch"
      transitive-overrides-major:
        patterns:
          - "io.netty:*"
          - "com.google.protobuf:*"
          - "io.opentelemetry:*"
          - "com.fasterxml.jackson*:*"
          - "ch.qos.logback:*"
          - "org.codehaus.plexus:*"
          - "org.apache.logging.log4j:*"
        update-types:
          - "major"
      transitive-overrides:
        patterns:
          - "io.netty:*"
          - "com.google.protobuf:*"
          - "io.opentelemetry:*"
          - "com.fasterxml.jackson*:*"
          - "ch.qos.logback:*"
          - "org.codehaus.plexus:*"
          - "org.apache.logging.log4j:*"
        update-types:
          - "minor"
          - "patch"
      backend:
        patterns:
          - "*"
        exclude-patterns:
          - "org.keycloak:*"
          - "org.keycloak.bom:*"
          - "io.netty:*"
          - "com.google.protobuf:*"
          - "io.opentelemetry:*"
          - "com.fasterxml.jackson*:*"
          - "ch.qos.logback:*"
          - "org.codehaus.plexus:*"
          - "org.apache.logging.log4j:*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/keycloak/"
      - "/keycloak/tools/scimverify/"
      - "/keycloak/tools/flais-scim-auth/"
      - "/apps/flais-keycloak-demo/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      docker-images:
        patterns:
          - "*"
        exclude-patterns:
          - "keycloak/keycloak"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/keycloak/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      compose-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
