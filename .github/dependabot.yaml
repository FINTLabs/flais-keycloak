version: 2

updates:
    - package-ecosystem: "npm"
      directories:
          - "/keycloak/libs/flais-theme/"
          - "/keycloak/tools/flais-scim-auth/"
          - "/apps/flais-keycloak-demo/"
      schedule:
          interval: "weekly"
          day: "sunday"
      groups:
          npm-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "gradle"
      directory: "/keycloak/"
      schedule:
          interval: "weekly"
          day: "sunday"
      open-pull-requests-limit: 15

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "sunday"

    - package-ecosystem: "docker"
      directory: "/keycloak/"
      schedule:
          interval: "weekly"
          day: "sunday"

    - package-ecosystem: "docker-compose"
      directory: "/keycloak/"
      schedule:
          interval: "weekly"
          day: "sunday"
