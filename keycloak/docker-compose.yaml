services:
  # ----------------------
  # Keycloak and its Postgres database
  # ----------------------
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION}
    command: >
      start-dev
      --import-realm
      --log-level="INFO,org.keycloak.authentication.authenticators:DEBUG,no.novari:DEBUG"
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-pg
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_DB_SCHEMA: public
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      keycloak-pg:
        condition: service_healthy
      mock-idp:
        condition: service_healthy
    networks:
      - keycloak

  keycloak-pg:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U keycloak -d keycloak'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - keycloak

  # ----------------------
  # Helper services
  # ----------------------
  mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8080/isalive
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./config/mock-idp:/config:ro
    networks:
      - keycloak

networks:
  keycloak:
    driver: bridge
    name: keycloak
