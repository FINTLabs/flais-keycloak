services:
  # ----------------------
  # Keycloak and its Postgres database
  # ----------------------
  keycloak:
    volumes:
      - ./config/kc:/opt/keycloak/data/import:ro
    ports:
      - "8890:8080"
      - "9900:9000"
  keycloak-pg:
    volumes:
      - ./data/pg:/var/lib/postgresql
    ports:
      - "5432:5432"

  # ----------------------
  # Helper services
  # ----------------------
  mock-idp:
    ports:
      - "127.0.0.1:9000:8080"
